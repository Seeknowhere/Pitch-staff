      stop();
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        setError("This browser can't reach a microphone here. Open the page file in Chrome, Edge or Safari, or analyze an audio file instead.");
        return;
      }
      try {
        const stream = await getMicStream();
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const src = ctx.createMediaStreamSource(stream);
        const analyser = ctx.createAnalyser();
        analyser.fftSize = 2048;
        src.connect(analyser);
        ctxRef.current = ctx; streamRef.current = stream;
        setMode("mic");
        runLoop(ctx, analyser);
      } catch (e) {
        setError("The microphone is blocked on this page. Download the page file and open it in your browser to use the mic, or analyze an audio file below.");
      }
    }, [stop, runLoop]);

    const onFile = useCallback(async (e) => {
      const file = e.target.files && e.target.files[0];
      e.target.value = "";
      if (!file) return;
      setError(""); setFileResult(""); stop();
      songRef.current = null; setSong(null); setPlayPos(0); playRef.current.offset = 0;
      cancelRef.current = false;
      setFileName(file.name); setMode("file"); setProgress(0);
      let audio;
      try {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        const ctx = new Ctx();
        const ab = await file.arrayBuffer();
        audio = await new Promise((res, rej) => {
          const p = ctx.decodeAudioData(ab, res, rej);
          if (p && p.then) p.then(res, rej);
        });
        if (ctx.close) ctx.close().catch(() => {});
      } catch (err) {
        setMode("idle");
        setError("That file couldn't be read as audio. Try an MP3, M4A or WAV.");
        return;
      }
      // mix to mono, then halve the sample rate so analysis stays fast on phones
      let data = audio.getChannelData(0);
      if (audio.numberOfChannels > 1) {
        const r = audio.getChannelData(1), m = new Float32Array(data.length);
        for (let i = 0; i < data.length; i++) m[i] = (data[i] + r[i]) / 2;
        data = m;
      }
      let sr = audio.sampleRate;
      if (sr >= 44100) {
        const h = new Float32Array(Math.floor(data.length / 2));
        for (let i = 0; i < h.length; i++) h[i] = (data[2 * i] + data[2 * i + 1]) / 2;
        data = h; sr = sr / 2;
      }
      const N = 1024, hop = 512, total = Math.max(1, Math.floor((data.length - N) / hop));
      const found = [];
      let cand = { midi: null, since: 0 }, confirmed = null, silentSince = -1;
      const recent = [];
      for (let f = 0; f < total; f++) {
        if (cancelRef.current) return;
        const t = (f * hop) / sr;
        const r = detectPitch(data.subarray(f * hop, f * hop + N), sr);
        if (r.freq > 0) {
          silentSince = -1;
          recent.push(r.freq); if (recent.length > 5) recent.shift();
          const med = [...recent].sort((a, b) => a - b)[Math.floor(recent.length / 2)];
          const { midi, cents } = freqToMidi(med);
          if (midi !== cand.midi) cand = { midi, since: t };
          if (t - cand.since >= 0.15 && confirmed !== midi) {
            if (found.length && found[found.length - 1].end == null) found[found.length - 1].end = cand.since;
            confirmed = midi; found.push({ midi, freq: med, cents, pos: cand.since, end: null });
          }
        } else {
          if (silentSince < 0) silentSince = t;
          if (t - silentSince > 0.12) { if (confirmed !== null && found.length && found[found.length - 1].end == null) found[found.length - 1].end = silentSince; confirmed = null; cand = { midi: null, since: 0 }; recent.length = 0; }
        }
        if (f % 150 === 0) { setProgress(f / total); await new Promise((res) => setTimeout(res, 0)); }
      }
      if (found.length && found[found.length - 1].end == null) found[found.length - 1].end = data.length / sr;
      songRef.current = { buffer: audio, notes: found };
      setSong({ name: file.name, duration: audio.duration });
      const now = Date.now();
      const entries = found.map((n, i) => ({
        id: now + "-" + i, t: now, note: midiInfo(n.midi).label, midi: n.midi,
        freq: Math.round(n.freq * 10) / 10, cents: n.cents, pos: Math.round(n.pos * 10) / 10, src: file.name,
      }));
      setTrail(entries.slice(-12).map((x) => ({ id: x.id, midi: x.midi })));
      if (recRef.current && entries.length) setHistory((h) => [...[...entries].reverse(), ...h].slice(0, 500));
      setProgress(1); setMode("idle");
      setFileResult(entries.length
        ? "Found " + entries.length + " notes in " + file.name + (recRef.current ? " and saved them to the log." : ".") + " Tap Play to hear it with the notes on the staff."
        : "No clear single notes found in " + file.name + ". Clips with one voice or instrument work best.");
    }, [stop]);

    const counts = useMemo(() => {
      const m = {};
      history.forEach((h) => { m[h.note] = (m[h.note] || 0) + 1; });
      return Object.entries(m).sort((a, b) => b[1] - a[1]).slice(0, 6);
    }, [history]);

    const flash = (msg) => { setCopyMsg(msg); setTimeout(() => setCopyMsg(""), 2600); };

    const buildText = () => {
      const list = [...history].reverse();
      const when = (h) => h.pos != null ? "at " + fmt(h.pos) + " (" + h.src + ")"
        : new Date(h.t).toLocaleString([], { month: "short", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit", second: "2-digit" });
      const lines = [
        "Tono - note log",
        "Exported " + new Date().toLocaleString([], { dateStyle: "medium", timeStyle: "short" }),
        list.length + " notes",
        "",
        "Sequence:",
        list.map((h) => h.note).join(" "),
        "",
        "#".padEnd(5) + "Note".padEnd(7) + "When".padEnd(34) + "Freq (Hz)".padEnd(11) + "Cents",
      ];
      list.forEach((h, i) => {
        lines.push(String(i + 1).padEnd(5) + h.note.padEnd(7) + when(h).padEnd(34) + h.freq.toFixed(1).padEnd(11) + (h.cents > 0 ? "+" : "") + h.cents);
      });
      return lines.join("\n") + "\n";
    };

    const exportTxt = async () => {
      if (!history.length) return;
      const text = buildText();
      const filename = "pitch-staff-notes-" + new Date().toISOString().slice(0, 10) + ".txt";
      let dl = null;
      try { dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null; } catch (e) { dl = null; }
      if (dl) {
        try { await dl.save({ filename, data: text }); flash("Exported " + filename); }
        catch (e) { flash(e && e.code === "declined" ? "Export cancelled" : e && e.code === "rate_limited" ? "One moment, then try again" : "Export isn't available in this view"); }
        return;
      }
      // opened as a plain file in a browser: use a normal download
      try {
        const url = URL.createObjectURL(new Blob([text], { type: "text/plain" }));
        const a = document.createElement("a");
        a.href = url; a.download = filename;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 2000);
        flash("Exported " + filename);
      } catch (e) { flash("Export isn't available in this view"); }
    };

    const copySequence = () => {
      const seq = [...history].reverse().map((h) => h.note).join(" ");
      if (!seq) return;
      const done = (msg) => { setCopyMsg(msg); setTimeout(() => setCopyMsg(""), 2200); };
      try {
        navigator.clipboard.writeText(seq).then(() => done("Copied " + history.length + " notes"), () => done("Copy blocked here"));
      } catch (e) { done("Copy blocked here"); }
    };

    const info = live ? midiInfo(live.midi) : null;
    const tuneColor = !live ? "var(--muted)" : Math.abs(live.cents) <= 10 ? "var(--good)" : Math.abs(live.cents) <= 25 ? "var(--warn)" : "var(--bad)";
    const isDark = theme ? theme === "dark" : !window.matchMedia("(prefers-color-scheme: light)").matches;
    const running = mode !== "idle";
    const showExample = !running && trail.length === 0;
    const tm = matchTarget && matchStatus && matchStatus.midi === matchTarget.midi ? matchStatus : null;

    return html`<div class="wrap flex flex-col gap-5">
      <header class="flex flex-wrap items-end justify-between gap-3">
        <div>
          <h1 class="display text-3xl sm:text-4xl font-bold">Tono</h1>
          <p class="muted text-sm">${tab === "live" ? "Sing, whistle or play one clean note and see exactly which note it is." : tab === "learn" ? "Learn a song's melody note by note, one phrase at a time." : tab === "karaoke" ? "Sing along to the music with scrolling lyrics and a live score." : "Compare your singing with the original vocal, phrase by phrase."}</p>
        </div>
        <div class="flex gap-2">
          <button class="btn btn-ghost" onClick=${() => setShowSettings((v) => !v)} aria-expanded=${showSettings ? "true" : "false"}>⚙ Settings</button>
          <button class="btn btn-ghost" onClick=${() => setTheme(isDark ? "light" : "dark")} aria-label="Switch theme">
            ${isDark ? "☀ Light" : "☾ Dark"}
          </button>
        </div>
      </header>

      ${showSettings && html`<${SettingsPanel} listening=${mode === "mic"} level=${level} onClose=${() => setShowSettings(false)}
        onChange=${() => bumpSettings((n) => n + 1)} onMicChange=${() => { if (mode === "mic") startMic(); }} />`}

      <div class="tabs" role="tablist">
        ${[["live", "Tuner"], ["learn", "Practice"], ["karaoke", "Karaoke"], ["analyst", "Singing Analyst"]].map(([k, l]) => html`<button key=${k} class="tab" role="tab" aria-selected=${tab === k ? "true" : "false"}
          onClick=${() => { if (k !== "live") stop(); setTab(k); setVisited((v) => ({ ...v, [k]: true })); }}>${l}</button>`)}
      </div>

      ${tab === "live" && html`<${React.Fragment}>
      <div class="flex flex-wrap items-center gap-2">
        ${mode === "mic"
          ? html`<button class="btn btn-primary" onClick=${stop}>■ Stop microphone</button>`
          : html`<button class="btn btn-primary" onClick=${startMic}>● Start Microphone</button>`}
      </div>

      ${error && html`<div class="notice" role="alert">${error}</div>`}

      <section class="panel p-4 sm:p-5 flex flex-col gap-4 min-w-0">
        <div class="flex flex-wrap items-end justify-between gap-4">
          <div class="flex items-end gap-1" style=${{ minHeight: 84 }}>
            ${info
              ? html`<span class="display font-bold" style=${{ fontSize: 76, lineHeight: 1, color: "var(--accent)" }}>${info.letter}</span>
                     ${info.sharp && html`<span class="display font-bold" style=${{ fontSize: 40, lineHeight: 1.1, color: "var(--accent)", alignSelf: "flex-start" }}>♯</span>`}
                     <span class="mono font-semibold" style=${{ fontSize: 28, lineHeight: 1.2 }}>${info.octave}</span>`
              : html`<span class="display font-bold muted" style=${{ fontSize: 56, lineHeight: 1.2 }}>${running ? "…" : "—"}</span>`}
          </div>
          <div class="flex flex-col items-end gap-1 text-right">
            <span class="label">${tm ? "Target " + pretty(midiInfo(matchTarget.midi).label) : "Frequency"}</span>
            <span class="mono text-xl">${live ? live.freq.toFixed(1) + " Hz" : "— Hz"}</span>
            <span class="mono text-sm" style=${{ color: tm ? (tm.phase === "hit" || (tm.cents != null && Math.abs(tm.cents) <= tm.tol) ? "var(--good)" : tm.cents != null ? "var(--warn)" : "var(--muted)") : tuneColor }}>
              ${tm
                ? (tm.phase === "hit" ? "Matched" : tm.phase === "listen" ? "Listen…" : tm.cents == null ? (running ? "Sing the target" : "Not listening") : signed(tm.cents) + " cents from target")
                : live ? (live.cents > 0 ? "+" : "") + live.cents + " cents" + (Math.abs(live.cents) <= 10 ? " · in tune" : live.cents > 0 ? " · sharp" : " · flat") : running ? "Listening…" : "Not listening"}
            </span>
          </div>
        </div>

        <div class="flex flex-col gap-2">
          ${tm
            ? html`<div class=${"tuner" + (tm.phase === "hit" ? " tuner-hit" : "")} aria-hidden="true">
                <div class="zone" style=${{ left: 50 - tm.tol + "%", width: 2 * tm.tol + "%" }}></div><div class="center"></div>
                ${tm.cents != null && tm.phase !== "listen" && tm.phase !== "hit" && html`<div class="needle" style=${{ left: 50 + Math.max(-50, Math.min(50, tm.cents)) + "%", background: Math.abs(tm.cents) <= tm.tol ? "var(--good)" : "var(--warn)" }}></div>`}
                ${tm.phase === "hit" && html`<div class="needle" style=${{ left: "50%", background: "var(--good)" }}></div>`}
              </div>
              <div class="flex justify-between mono text-xs muted"><span>too low</span><span>target</span><span>too high</span></div>
              <div class="level" style=${{ height: 6 }} title="Hold progress"><div style=${{ width: tm.hold * 100 + "%", background: "var(--good)", transition: "none" }}></div></div>`
            : html`<div class="tuner" aria-hidden="true">
                <div class="zone"></div><div class="center"></div>
                ${live && html`<div class="needle" style=${{ left: 50 + Math.max(-50, Math.min(50, live.cents)) + "%", background: tuneColor }}></div>`}
              </div>
              <div class="flex justify-between mono text-xs muted"><span>−50¢</span><span>0</span><span>+50¢</span></div>`}
        </div>

        <div class="flex items-center justify-end gap-3 text-xs muted">
          <span>Mic level</span>
          <div class="level" style=${{ width: 90 }} title="Input level"><div style=${{ width: level * 100 + "%" }}></div></div>
        </div>
      </section>

      <${MatchTrainer} hookRef=${matchHook} listening=${mode === "mic"} onStartMic=${startMic} onTarget=${setMatchTarget} onStatus=${setMatchStatus} sung=${live ? live.midi : null} />
      <//>`}
      <div hidden=${tab !== "learn"}>${visited.learn && html`<${Learn} themeKey=${isDark ? "dark" : "light"} active=${tab === "learn"} orig=${vocal} onPickOrig=${pickVocal} lyrics=${vocalLyrics} updateLyrics=${updateVocalLyrics} />`}</div>
      <div hidden=${tab !== "karaoke"}>${visited.karaoke && html`<${Karaoke} themeKey=${isDark ? "dark" : "light"} active=${tab === "karaoke"} orig=${vocal} onPickOrig=${pickVocal} lyrics=${vocalLyrics} updateLyrics=${updateVocalLyrics} onSendTake=${sendTake} ...${musicProps} />`}</div>
      <div hidden=${tab !== "analyst"}>${visited.analyst && html`<${Analyst} themeKey=${isDark ? "dark" : "light"} active=${tab === "analyst"} orig=${vocal} onPickOrig=${pickVocal} lyrics=${vocalLyrics} updateLyrics=${updateVocalLyrics} incomingTake=${handoff} ...${musicProps} />`}</div>
    </div>`;
  }

  ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
})();
</script>
</body>
</html>
