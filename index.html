<style>
/* Layout: one working surface — controls bar, live readout + staff, history log beside it (stacks on phones) */
:root {
  --bg: #0f1218;
  --surface: #161b24;
  --surface-2: #1d2430;
  --line: #2a3240;
  --fg: #e8ebf1;
  --muted: #8b93a3;
  --accent: #e2b65c;
  --accent-ink: #1a1408;
  --good: #5fd39a;
  --you: #7fb2ff;
  --warn: #e7a54b;
  --bad: #ef6f6c;
  --rec: #ff5d5d;
  --font-display: "Bricolage Grotesque", "Instrument Sans", system-ui, sans-serif;
  --font-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --font-music: "Noto Music", "Bravura Text", "Segoe UI Symbol", serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #eef1f5; --surface: #ffffff; --surface-2: #f4f6f9; --line: #d7dce4;
    --fg: #151a22; --muted: #5d6676; --accent: #9a6a12; --accent-ink: #ffffff;
    --good: #16865a; --warn: #a86a12; --bad: #c43b38; --rec: #d63a3a; --you: #2b62c4;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #eef1f5; --surface: #ffffff; --surface-2: #f4f6f9; --line: #d7dce4;
  --fg: #151a22; --muted: #5d6676; --accent: #9a6a12; --accent-ink: #ffffff;
  --good: #16865a; --warn: #a86a12; --bad: #c43b38; --rec: #d63a3a; --you: #2b62c4;
  color-scheme: light;
}
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
.wrap {
  max-width: 1100px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 40px;
}
.display { font-family: var(--font-display); letter-spacing: -0.02em; text-wrap: balance; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); font-weight: 600; }
.btn {
  display: inline-flex; align-items: center; gap: 8px; border-radius: 10px; padding: 9px 14px;
  font-weight: 600; font-size: 14px; border: 1px solid var(--line); background: var(--surface-2);
  color: var(--fg); cursor: pointer; transition: transform .08s, background .15s, border-color .15s;
}
.btn:hover { border-color: var(--muted); }
.btn:active { transform: translateY(1px); }
.btn:focus-visible, .switch:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn-primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn-primary:hover { border-color: var(--fg); }
.btn-ghost { background: transparent; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.switch {
  display: inline-flex; align-items: center; gap: 10px; padding: 7px 12px 7px 8px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); cursor: pointer; font-weight: 600; font-size: 14px;
}
.switch .track { width: 34px; height: 20px; border-radius: 999px; background: var(--line); position: relative; transition: background .15s; }
.switch .knob { position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--fg); transition: left .15s; }
.switch[aria-checked="true"] .track { background: var(--rec); }
.switch[aria-checked="true"] .knob { left: 16px; background: #fff; }
.rec-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--rec); animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { opacity: .25; } }
.tuner { position: relative; height: 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); }
.tuner .zone { position: absolute; top: 0; bottom: 0; left: 40%; width: 20%; background: color-mix(in srgb, var(--good) 22%, transparent); border-radius: 999px; }
.tuner .center { position: absolute; top: -4px; bottom: -4px; left: 50%; width: 2px; margin-left: -1px; background: var(--muted); }
.tuner .needle { position: absolute; top: -5px; width: 4px; height: 18px; margin-left: -2px; border-radius: 2px; transition: left .08s linear; }
.level { height: 4px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.level > div { height: 100%; background: var(--accent); transition: width .06s linear; }
.chip { display: inline-flex; align-items: baseline; gap: 6px; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); font-size: 13px; }
.row { display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; padding: 9px 4px; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.notice { border: 1px solid color-mix(in srgb, var(--warn) 50%, var(--line)); background: color-mix(in srgb, var(--warn) 10%, var(--surface)); border-radius: 12px; padding: 12px 14px; font-size: 14px; }
.history-list { max-height: 460px; overflow-y: auto; }
.staff-box { overflow-x: auto; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { padding: 7px 12px; font-weight: 600; font-size: 13px; background: var(--surface-2); color: var(--muted); border: 0; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.seg button:focus-visible, .tab:focus-visible, .spot:focus-visible, .nt-row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
.tab { padding: 10px 14px; font-weight: 600; font-size: 14px; color: var(--muted); background: none; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; cursor: pointer; }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.spot { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; text-align: left; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); }
.spot:hover { border-color: var(--muted); }
.note-table { max-height: 380px; overflow: auto; border: 1px solid var(--line); border-radius: 10px; }
.nt-row { display: grid; grid-template-columns: 48px 1fr 1fr 64px minmax(96px, 1.4fr); gap: 8px; align-items: center; width: 100%; min-width: 420px; padding: 8px 12px; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); color: var(--fg); cursor: pointer; font: inherit; }
.nt-row.nt-plain { grid-template-columns: 48px 1fr 1fr minmax(150px, 2fr); }
.nt-row:last-child { border-bottom: 0; }
.nt-head { position: sticky; top: 0; background: var(--surface); cursor: default; z-index: 1; }
.nt-now { background: color-mix(in srgb, var(--accent) 14%, transparent); }
@media (max-width: 480px) { .spot { grid-template-columns: 1fr auto; } .spot > span:nth-child(2) { grid-column: 1 / -1; grid-row: 2; } }
.mixer { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px 16px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); }
.mix-row { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px; min-width: 0; }
.mix-row input { width: 100%; min-width: 0; }
@media (max-width: 640px) { .mixer { grid-template-columns: 1fr; } .mix-row { grid-template-columns: 92px 1fr auto; } }
.tech { display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); min-width: 0; }
.tag { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.tag-good { color: var(--good); background: color-mix(in srgb, var(--good) 14%, transparent); }
.tag-warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); }
.tag-bad { color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, transparent); }
.phrase { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); }
.phrase.now { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.phrase.done .ph-num { background: var(--good); color: var(--bg); }
.ph-num { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 600; background: var(--line); color: var(--fg); }
@media (max-width: 560px) { .phrase { grid-template-columns: 32px minmax(0, 1fr); } .phrase > span:last-child { grid-column: 1 / -1; justify-content: flex-start; } }
.attempt { border: 1px solid var(--line); border-radius: 12px; padding: 14px; background: var(--surface-2); }
.nchip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-family: var(--font-mono); font-size: 12px; font-weight: 600; border: 1px solid var(--line); }
.nchip.ok { color: var(--good); border-color: color-mix(in srgb, var(--good) 40%, var(--line)); }
.nchip.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
.nchip.miss { color: var(--muted); }
.switch[disabled] { opacity: .45; cursor: not-allowed; }
.keys { position: relative; height: 150px; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
.wkey { position: absolute; top: 0; bottom: 0; border: 1px solid var(--line); border-radius: 0 0 8px 8px; background: #f7f7f4; color: #4a4f5a; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 8px; font-size: 11px; cursor: pointer; }
.bkey { position: absolute; top: 0; height: 60%; z-index: 2; border: 1px solid #000; border-radius: 0 0 6px 6px; background: #1d2027; cursor: pointer; }
.wkey:active { background: #e6e6e1; } .bkey:active { background: #3a3f4a; }
.wkey.k-target { background: color-mix(in srgb, var(--accent) 45%, #f7f7f4); color: #1a1408; font-weight: 700; }
.bkey.k-target { background: var(--accent); }
.wkey.k-hit, .bkey.k-hit { background: var(--good); color: #062014; font-weight: 700; }
.wkey.k-sung, .bkey.k-sung { box-shadow: inset 0 0 0 3px var(--you); }
.wkey:focus-visible, .bkey:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.match-card { display: flex; flex-wrap: wrap; gap: 16px 24px; align-items: center; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); transition: border-color .2s, background .2s; }
.tuner-hit { border-color: var(--good); background: color-mix(in srgb, var(--good) 18%, var(--surface-2)); }
.match-card.hit { border-color: var(--good); background: color-mix(in srgb, var(--good) 12%, var(--surface-2)); }
select.btn { appearance: auto; }
.player { display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto; align-items: center; gap: 10px; }
.player input { width: 100%; min-width: 0; }
.take-box { display: flex; flex-direction: column; gap: 12px; padding: 12px 14px; border: 1px solid var(--accent); border-radius: 12px; background: color-mix(in srgb, var(--accent) 8%, var(--surface-2)); }
.song-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); }
.stage-big { min-height: 230px; padding: 28px 12px; }
.stage-big .kline { max-width: 26ch; }
.stage { display: flex; flex-direction: column; gap: 6px; align-items: center; text-align: center; padding: 18px 8px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); min-height: 150px; justify-content: center; }
.kline { margin: 0; font-family: var(--font-display); font-weight: 700; line-height: 1.25; text-wrap: balance; max-width: 34ch; }
.kline.dim { font-weight: 600; opacity: .55; }
.kw { background: linear-gradient(90deg, var(--accent) var(--p, 0%), var(--fg) var(--p, 0%)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.kline.dim .kw { background: none; color: var(--muted); }
.app-wrap { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)) !important; }
.bottom-nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: var(--surface); border-top: 1px solid var(--line); padding: 6px max(8px, env(safe-area-inset-left, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-right, 0px)); }
.bottom-nav button { display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 52px; justify-content: center; border: 0; background: none; color: var(--muted); font: inherit; font-size: 11px; font-weight: 600; cursor: pointer; border-radius: 10px; }
.bottom-nav button[aria-current="page"] { color: var(--accent); }
.bottom-nav button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
@media (min-width: 900px) { .bottom-nav { left: 50%; right: auto; transform: translateX(-50%); width: 600px; bottom: 12px; border: 1px solid var(--line); border-radius: 18px; padding-bottom: 8px; box-shadow: 0 8px 30px rgba(0,0,0,.25); } }
.song-bar { display: flex; align-items: center; gap: 12px; }
.song-ico { width: 40px; height: 40px; border-radius: 10px; background: color-mix(in srgb, var(--accent) 16%, var(--surface-2)); color: var(--accent); display: grid; place-items: center; flex-shrink: 0; }
.playbar { position: sticky; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); z-index: 20; display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); box-shadow: 0 6px 24px rgba(0,0,0,.18); }
@media (min-width: 900px) { .playbar { bottom: calc(88px + env(safe-area-inset-bottom, 0px)); } }
.playbar input[type=range] { width: 100%; min-width: 0; accent-color: var(--accent); }
.round-btn { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; flex-shrink: 0; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); cursor: pointer; }
.round-btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.round-btn.big { width: 64px; height: 64px; }
.round-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.icon-btn { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; flex-shrink: 0; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; }
.icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sheet-wrap { position: fixed; inset: 0; z-index: 50; background: rgba(5,7,10,.55); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 620px; max-height: 86vh; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-bottom: 0; border-radius: 20px 20px 0 0; box-shadow: 0 -10px 40px rgba(0,0,0,.3); }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px max(18px, env(safe-area-inset-left, 0px)) 10px; border-bottom: 1px solid var(--line); }
.sheet-body { overflow-y: auto; padding: 16px max(18px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 18px; }
.file-list { display: flex; flex-direction: column; gap: 10px; }
.file-list > .panel { border-radius: 12px; background: var(--surface-2); }
.file-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); }
.subtabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.subtabs::-webkit-scrollbar { display: none; }
.subtabs button { min-height: 44px; padding: 0 12px; border: 0; border-bottom: 2px solid transparent; background: none; color: var(--muted); font: inherit; font-weight: 600; font-size: 14px; white-space: nowrap; cursor: pointer; }
.subtabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.subtabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.mic-btn { width: 52px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); display: grid; place-items: center; cursor: pointer; flex-shrink: 0; }
.mic-btn.on { border-color: var(--rec); color: var(--rec); background: color-mix(in srgb, var(--rec) 12%, var(--surface)); }
.mic-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tuner-screen { display: flex; flex-direction: column; gap: 12px; min-height: calc(100dvh - 190px - env(safe-area-inset-bottom, 0px)); }
.tuner-card { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 16px; border-radius: 20px; background: var(--surface); border: 1px solid var(--line); transition: border-color .2s, background .2s; }
.tuner-card.hit { border-color: var(--good); background: color-mix(in srgb, var(--good) 10%, var(--surface)); }
.tuner-actions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) auto; gap: 8px; }
.listen-bar { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
.coach { scroll-margin-top: 12px; }
.coach-actions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.coach-actions .btn { justify-content: center; min-height: 44px; }
.link-btn { background: none; border: 0; padding: 0; color: var(--accent); font: inherit; font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.mode-seg { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 4px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.mode-seg button { min-height: 42px; border: 0; border-radius: 9px; background: none; color: var(--muted); font: inherit; font-weight: 600; font-size: 14px; cursor: pointer; }
.mode-seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.opt-group { display: flex; flex-direction: column; gap: 8px; }
.empty-hero { display: flex; flex-direction: column; gap: 6px; }
.lyr-band { position: relative; height: 30px; border-bottom: 1px solid var(--line); }
.lyr { position: absolute; top: 5px; height: 20px; line-height: 20px; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 6px; border-left: 2px solid var(--line); color: var(--muted); }
.lyr.on { color: var(--fg); border-left-color: var(--accent); font-weight: 600; }
.karaoke { display: flex; flex-direction: column; gap: 2px; min-height: 52px; }
.chart-lyric { height: 78px; overflow: hidden; min-height: 0; }
.chart-lyric .cur { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.chart-lyric .nxt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.now-row { height: 34px; display: flex; align-items: center; }
.karaoke .cur { font-family: var(--font-display); font-size: 20px; font-weight: 700; line-height: 1.25; text-wrap: balance; }
.karaoke .nxt { font-size: 13px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- Karaoke stage theme (always dark) ---------- */
:root.kara, :root.kara[data-theme] {
  --bg: #0a0910; --surface: #15121f; --surface-2: #1d1930; --line: #2e2845;
  --fg: #f4efe4; --muted: #a59fbd; --accent: #e2b65c; --accent-ink: #1a1408;
  --good: #5fd39a; --warn: #e7a54b; --bad: #ef6f6c; --rec: #ff5d5d; --you: #8fbcff;
  color-scheme: dark;
}
:root.kara body { min-height: 100dvh; background: radial-gradient(120% 55% at 50% 30%, rgba(139,92,246,.24), transparent 62%), radial-gradient(90% 40% at 50% 100%, rgba(226,182,92,.13), transparent 70%), #0a0910; background-attachment: fixed; }
.bottom-nav .nav-ico { display: grid; place-items: center; width: 52px; height: 30px; border-radius: 999px; transition: background .2s, box-shadow .2s; }
:root.kara .bottom-nav { background: rgba(12,10,20,.94); border-color: rgba(139,92,246,.28); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
:root.kara .bottom-nav button[aria-current="page"] { color: #f3d18c; font-weight: 700; }
:root.kara .bottom-nav button[aria-current="page"] .nav-ico { background: linear-gradient(135deg, rgba(139,92,246,.6), rgba(226,182,92,.45)); box-shadow: 0 0 16px rgba(139,92,246,.5); color: #fff; }
:root.kara .stage { background: transparent; border-color: transparent; }
:root.kara .stage .kline:not(.dim) { filter: drop-shadow(0 0 14px rgba(226,182,92,.28)); }
:root.kara .playbar { background: rgba(21,18,31,.92); border-color: rgba(139,92,246,.25); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
:root.kara .playbar input[type=range] { accent-color: #b98cf0; }
.kara-lane { position: relative; }
.kara-pop { position: absolute; left: 50%; top: 12px; z-index: 3; padding: 4px 14px; border-radius: 999px; font-family: var(--font-display); font-weight: 700; font-size: 16px; color: #1a1408; background: linear-gradient(90deg, #f3d18c, #e2b65c); box-shadow: 0 6px 20px rgba(226,182,92,.45); pointer-events: none; white-space: nowrap; animation: kpop .95s ease-out forwards; }
.kara-pop.great { background: linear-gradient(90deg, #c4b5fd, #8b5cf6); color: #fff; box-shadow: 0 6px 20px rgba(139,92,246,.45); }
.kara-pop.lose { background: linear-gradient(90deg, #9cc4ff, #5b8fe8); color: #fff; box-shadow: 0 6px 20px rgba(91,143,232,.45); }
/* Battle: tug-of-war bar, gold (you) pushes in from the left, blue (rival) from the right */
.battle-bar { display: flex; flex-direction: column; gap: 6px; padding: 8px 12px; border-radius: 14px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); }
.battle-names { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; font-family: var(--font-display); font-weight: 700; font-size: 14px; }
.battle-names b { font-size: 20px; }
.battle-names .you { color: #f3d18c; }
.battle-names .opp { color: #9cc4ff; text-align: right; }
.battle-names .tally { font-size: 13px; color: var(--muted); }
.battle-track { position: relative; height: 12px; border-radius: 999px; overflow: hidden; background: linear-gradient(90deg, #5b8fe8, #9cc4ff); }
.battle-fill { position: absolute; top: 0; bottom: 0; left: 0; background: linear-gradient(90deg, #e2b65c, #f3d18c); transition: width .6s cubic-bezier(.2,.8,.2,1); }
.battle-mid { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: rgba(255,255,255,.55); }
.battle-input { min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); font-size: 16px; }
/* Karaoke mode choice and battle lobby */
.mode-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.mode-card { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; text-align: left; padding: 22px 20px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); color: var(--fg); cursor: pointer; transition: transform .15s, border-color .15s; }
.mode-card:hover { transform: translateY(-2px); border-color: var(--accent); }
.mode-card.battle:hover { border-color: var(--you); }
.mode-emoji { font-size: 34px; line-height: 1; margin-bottom: 4px; }
.battle-lobby { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; padding: 20px 16px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); }
.lobby-players { display: flex; flex-direction: column; gap: 8px; width: 100%; margin-top: 6px; }
.lobby-player { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); border-left: 4px solid var(--you); }
.lobby-player.you { border-left-color: var(--accent); }
.share-song { display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line); }
.share-track { position: relative; height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; }
.share-fill { position: absolute; top: 0; bottom: 0; left: 0; background: var(--accent); transition: width .3s; }
/* My songs */
.my-songs { display: flex; flex-direction: column; gap: 6px; }
.my-song { display: flex; align-items: stretch; gap: 6px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); }
.my-song.current { border-color: var(--accent); }
.my-song-main { flex: 1; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; padding: 10px 12px; background: none; border: none; color: var(--fg); cursor: pointer; min-height: 48px; }
.my-song-del { flex: none; min-width: 48px; font-size: 16px; }
.my-song-del.sure { color: var(--bad); font-size: 13px; font-weight: 600; }
.battle-hl { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; padding: 14px; border-radius: 16px; background: var(--surface-2); border: 1px solid var(--line); }
.battle-hl > .btn-primary { align-self: stretch; }
.battle-opt { display: flex; align-items: flex-start; gap: 10px; padding: 12px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); cursor: pointer; }
.battle-opt input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--accent); flex: none; }
.candid-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
.candid { flex: none; width: 96px; height: 72px; padding: 0; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: var(--surface-2); cursor: zoom-in; }
.candid img { width: 100%; height: 100%; object-fit: cover; display: block; }
.candid-big { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(0,0,0,.85); border: none; cursor: zoom-out; }
.candid-big img { max-width: 100%; max-height: 100%; border-radius: 12px; }
.text-xs.you { color: #f3d18c; } .text-xs.opp { color: #9cc4ff; }
/* Battle album: a scrapbook of saved battles */
.album-record { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.album-record > div { display: flex; flex-direction: column; gap: 2px; padding: 12px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
.album-record b { font-family: var(--font-display); font-size: 24px; }
.album-record span { font-size: 12px; color: var(--muted); }
.album-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 14px; }
.album-tile { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 0; text-align: left; background: none; border: none; color: var(--fg); cursor: pointer; }
.album-tile-board { position: relative; width: 100%; aspect-ratio: 1 / 1.03; margin-bottom: 6px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); overflow: hidden; }
.album-tile-song { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; text-align: center; font-family: var(--font-display); font-weight: 700; color: var(--muted); }
.album-board { position: relative; width: 100%; aspect-ratio: 350 / 470; border-radius: 20px; background: var(--surface); border: 1px solid var(--line); overflow: hidden; }
.pola { position: absolute; box-sizing: border-box; background: #f4efe4; padding: 3.5% 3.5% 12%; border-radius: 2px; box-shadow: 0 8px 20px rgba(0,0,0,.5); }
.pola img { display: block; width: 100%; aspect-ratio: 1 / 0.94; object-fit: cover; }
.pola img.me { background: #b8862f; } .pola img.them { background: #4f7fd0; }
.pola-cap { position: absolute; left: 0; right: 0; bottom: 3%; text-align: center; font-family: var(--font-mono); font-size: 10px; color: #3a3450; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 6px; }
.tape { position: absolute; width: 22%; height: 7%; background: rgba(244,239,228,.38); border-left: 1px dashed rgba(10,9,16,.25); border-right: 1px dashed rgba(10,9,16,.25); }
.tape.big { width: 15%; height: 3.4%; }
.album-sticker { position: absolute; width: 33%; aspect-ratio: 1; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,.4); }
.album-sticker .mono { font-size: 9px; font-weight: 600; letter-spacing: .08em; }
.album-sticker b { font-family: var(--font-display); font-size: 16px; line-height: 1; }
.album-sticker.win, .album-winner.win { background: #e2b65c; color: #1a1408; }
.album-sticker.loss, .album-winner.loss { background: #7fb2ff; color: #0a0910; }
.album-sticker.draw, .album-winner.draw { background: #c4b5fd; color: #0a0910; }
.album-winner { position: absolute; left: 36%; top: 62%; width: 26%; aspect-ratio: 1; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; transform: rotate(-10deg); box-shadow: 0 8px 20px rgba(0,0,0,.5); border: 3px dashed rgba(26,20,8,.35); text-align: center; }
.album-winner .mono { font-size: 9px; font-weight: 600; letter-spacing: .1em; }
.album-winner b { font-family: var(--font-display); font-size: 16px; line-height: 1.05; padding: 0 6px; overflow-wrap: anywhere; }
.album-stub { position: absolute; right: 4%; bottom: 3%; max-width: 46%; display: flex; flex-direction: column; gap: 1px; padding: 8px 12px; background: #f4efe4; color: #1a1408; border-radius: 6px; transform: rotate(4deg); box-shadow: 0 6px 14px rgba(0,0,0,.45); border-left: 2px dashed #a59fbd; }
.album-stub .mono { font-size: 10px; letter-spacing: .08em; color: #5b5470; }
.album-stub b { font-family: var(--font-display); font-size: 15px; overflow-wrap: anywhere; }
.album-remix { display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 18px; background: var(--surface-2); border: 1px solid var(--line); }
.album-play { flex: none; width: 52px; height: 52px; border-radius: 50%; border: none; background: var(--accent); color: var(--accent-ink); display: flex; align-items: center; justify-content: center; cursor: pointer; }
.album-bars { display: flex; align-items: center; gap: 3px; height: 44px; }
.album-bars span { flex: 1; border-radius: 2px; transition: opacity .2s; }
.album-bars .you { background: #e2b65c; } .album-bars .opp { background: #7fb2ff; } .album-bars .both { background: #c4b5fd; }
.album-bars .later { opacity: .35; }
.album-key { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.album-key.you { background: #e2b65c; } .album-key.opp { background: #7fb2ff; }
.album-stats { display: flex; flex-direction: column; border-radius: 16px; border: 1px solid var(--line); overflow: hidden; font-size: 14px; }
.album-stats > div { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 10px 14px; border-top: 1px solid var(--line); }
.album-stats > div:first-child { border-top: none; }
.album-stats > div.head { background: var(--surface-2); font-size: 12px; font-weight: 600; }
.album-stats [role="cell"], .album-stats [role="columnheader"] { text-align: center; font-weight: 600; overflow-wrap: anywhere; }
.album-remove { align-self: center; color: var(--bad); }
.battle-keep { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
/* YouTube karaoke */
.yt-list { display: flex; flex-direction: column; gap: 8px; }
.yt-item { display: flex; align-items: center; gap: 12px; padding: 8px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); color: var(--fg); text-align: left; cursor: pointer; min-height: 64px; }
.yt-item img { width: 112px; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 8px; flex: none; background: var(--line); }
.yt-title { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 14px; }
.yt-frame { position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 14px; overflow: hidden; background: #000; }
.yt-frame > div, .yt-frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.yt-voice { display: flex; flex-direction: column; gap: 12px; padding: 14px; border-radius: 16px; background: var(--surface-2); border: 1px solid var(--line); }
.yt-note { flex: none; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-weight: 700; font-size: 20px; background: var(--surface); border: 2px solid var(--accent); color: var(--accent); }
.yt-level { height: 6px; border-radius: 999px; background: var(--line); overflow: hidden; margin-top: 6px; }
.yt-level span { display: block; height: 100%; background: var(--accent); transition: width .08s; }
.yt-trail { width: 100%; height: 110px; border-radius: 10px; background: var(--surface); }
.battle-notice { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; padding: 14px 16px; border-radius: 16px; background: rgba(127,178,255,.10); border: 1px solid rgba(127,178,255,.35); }
/* Battle results */
.battle-win { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; padding: 24px 16px; border-radius: 20px; border: 1px solid var(--line); background: var(--surface); }
.battle-win.you { background: linear-gradient(180deg, rgba(226,182,92,.22), rgba(226,182,92,.04)); border-color: rgba(226,182,92,.5); }
.battle-win.opp { background: linear-gradient(180deg, rgba(127,178,255,.20), rgba(127,178,255,.04)); border-color: rgba(127,178,255,.45); }
.battle-win-emoji { font-size: 54px; line-height: 1; }
.battle-stats { display: flex; flex-direction: column; border-radius: 16px; border: 1px solid var(--line); overflow: hidden; }
.battle-stats-row { display: grid; grid-template-columns: 1.4fr 1fr 1fr; align-items: center; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--line); text-align: center; font-family: var(--font-display); font-weight: 700; font-size: 17px; }
.battle-stats-row:first-child { border-top: none; }
.battle-stats-row > :first-child { text-align: left; font-family: var(--font-body); font-weight: 500; }
.battle-stats-row.head { font-size: 13px; background: var(--surface-2); }
.battle-stats-row .you { color: #f3d18c; } .battle-stats-row .opp { color: #9cc4ff; }
.battle-stats-row .best { font-size: 20px; }
.battle-stats-row .best::after { content: " ★"; font-size: 12px; }
@keyframes kpop { 0% { opacity: 0; transform: translateX(-50%) translateY(8px) scale(.8) rotate(-4deg); } 20% { opacity: 1; transform: translateX(-50%) scale(1.08) rotate(-4deg); } 70% { opacity: 1; transform: translateX(-50%) scale(1) rotate(-4deg); } 100% { opacity: 0; transform: translateX(-50%) translateY(-10px) rotate(-4deg); } }
.combo-chip { display: inline-flex; align-items: baseline; gap: 5px; padding: 4px 10px; border-radius: 999px; background: rgba(139,92,246,.18); border: 1px solid rgba(139,92,246,.42); color: #c4b5fd; font-size: 12px; font-weight: 700; }
.score-chip { display: inline-flex; flex-direction: column; align-items: flex-end; padding: 3px 12px; border-radius: 14px; background: rgba(226,182,92,.12); border: 1px solid rgba(226,182,92,.35); }
.score-chip b { font-family: var(--font-display); font-size: 22px; line-height: 1; color: #f3d18c; }
.mic-ring { position: relative; flex: none; width: max-content; display: grid; place-items: center; border-radius: 50%; }
.mic-ring::before { content: ""; position: absolute; inset: -7px; border-radius: 50%; border: 3px solid rgba(226,182,92,.5); box-shadow: 0 0 calc(6px + 30px * var(--lv, 0)) rgba(226,182,92, calc(.2 + .5 * var(--lv, 0))); transform: scale(calc(1 + .14 * var(--lv, 0))); transition: transform .08s linear, box-shadow .08s linear; pointer-events: none; }
.ready-mic { position: relative; width: 96px; height: 96px; border-radius: 50%; border: 0; background: linear-gradient(160deg, #f3d18c, #d9a748); color: #1a1408; display: grid; place-items: center; cursor: pointer; box-shadow: 0 10px 30px rgba(226,182,92,.35), 0 0 0 10px rgba(226,182,92,.08), 0 0 0 22px rgba(226,182,92,.04); }
.ready-mic:focus-visible { outline: 2px solid #f3d18c; outline-offset: 6px; }
.k-chip { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.12); color: var(--fg); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
.kara-count { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; background: rgba(8,6,14,.55); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); border: 0; cursor: pointer; }
.count-num { font-family: var(--font-display); font-weight: 700; font-size: 140px; line-height: 1; color: #f3d18c; text-shadow: 0 0 40px rgba(226,182,92,.55); animation: kcount .7s ease-out both; }
@keyframes kcount { 0% { opacity: 0; transform: scale(1.6); } 30% { opacity: 1; transform: scale(1); } 100% { opacity: .2; transform: scale(.85); } }
.kara-hero { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; padding: 18px 8px 6px; }
.rank-title { font-family: var(--font-display); font-weight: 700; font-size: 38px; line-height: 1.05; letter-spacing: -0.02em; background: linear-gradient(90deg, #f3d18c, #ffffff 50%, #c4b5fd); -webkit-background-clip: text; background-clip: text; color: transparent; }
.confetti { position: absolute; left: -16px; right: -16px; top: -10px; height: 320px; overflow: hidden; pointer-events: none; }
.confetti i { position: absolute; top: -14px; width: 7px; height: 12px; border-radius: 2px; opacity: 0; animation: kfall 2.8s ease-in forwards; }
@keyframes kfall { 0% { opacity: 1; transform: translateY(0) rotate(0); } 85% { opacity: 1; } 100% { opacity: 0; transform: translateY(300px) rotate(540deg); } }
.part-card { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
@media (prefers-reduced-motion: reduce) { .kara-pop, .count-num { animation-duration: .01s; } .kara-pop { animation: none; opacity: 1; transform: translateX(-50%) rotate(-4deg); } .confetti { display: none; } .mic-ring::before { transition: none; } }
[hidden] { display: none !important; }
.install-tip{display:flex;align-items:center;gap:10px;max-width:560px;margin:8px auto 0;padding:10px 12px;border-radius:14px;background:var(--panel,rgba(127,127,127,.12));border:1px solid rgba(246,207,110,.35)}.install-tip img{border-radius:9px;flex:none}.install-tip .btn{flex:none}</style>
